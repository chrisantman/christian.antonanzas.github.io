    Education:
      - institution: Universitat Politècnica de València (UPV)
        location: Valencia, Spain
        area: Telecommunications
        studyType: PhD
        start_date: 2013
        end_date: 2019
        score: Cum Laude & International Mention
        highlights:
          - Distributed and collaborative adaptive algorithms for active noise control over acoustic sensor networks.
          - Research stay at KU Leuven (ESAT/STADIUS).

    Experience:
      - company: Universidad Internacional de La Rioja (UNIR)
        position: Teaching and Research Staff (PDI) — Lecturer
        location: Logroño, Spain
        start_date: 2020
        end_date: present
        summary: Teaching acoustics, sound and music technology in the Degree in Music and the Master's in Musical Research (Sonorización, Room Acoustics, Recording/Mixing/Mastering, Audio & MIDI editing, Acoustics applied to Sonology and Musicology). Supervision of Master's theses and participation in teaching innovation projects (DELTA, LAB Didáctica, reference lecturer in professional AI).

      - company: Voicemod
        position: Audio Technical Lead
        location: Spain
        start_date: 2022
        end_date: present
        summary: Technical lead of audio in real-time voice processing products; DSP research and prototyping in MATLAB/Python with integration into a real-time C/C++ audio framework (VST plugins); technical coordination of audio R&D.

      - company: Capgemini Engineering
        position: Senior Acoustic Engineer
        location: Spain
        start_date: 2020
        end_date: 2022
        summary: Electroacoustic consulting and acoustic conditioning of large venues (mainly train stations); 3D modelling (SketchUp, Revit) and electroacoustic simulation with EASE 4.4; technical proposals and result reports.

      - company: Bosonit
        position: Technical Project Manager / Project Manager
        location: La Rioja, Spain
        start_date: 2018
        end_date: 2021
        summary: Leadership of R&D+I projects applying the FIWARE platform to IoT and real-time data ecosystems (CULTIVO 4.0, FIFACE, FIRACE, FISTREAM, RIOGISTICS H2020, AFARCLOUD, FIWINE, among others).

      - company: TECESA
        position: Acoustic Engineer
        location: Spain
        start_date: 2012
        end_date: 2014
        summary: Electroacoustic and room acoustic consultancy and AV engineering for theatres, auditoriums and large venues in Spain, Turkey, Qatar and Oman.

      - company: GTAC (iTEAM-UPV), Universitat Politècnica de València
        position: Predoctoral Researcher (MINECO grant)
        location: Valencia, Spain
        start_date: 2013
        end_date: 2018
        summary: Research on distributed and collaborative audio signal processing for active noise control; design, simulation and real-time implementation of distributed ANC algorithms.

    Awards:
      - title: CNEAI research period (sexenio)
        awarder: Spanish National Agency for Quality Assessment and Accreditation (ANECA)
