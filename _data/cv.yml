  summary: PhD in Telecommunications (Universitat Politècnica de València, Cum Laude, International Mention) specializing in distributed adaptive algorithms for active noise control over acoustic sensor networks. Researcher and lecturer at the Universidad Internacional de La Rioja (UNIR), with a dual academic-industrial career in acoustics, audio signal processing, voice technology and creative AI applied to music and sound.

